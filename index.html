<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Fish</title>
  <meta name="theme-color" content="#4CAF50">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Bootstrap CSS -->
  <link href="css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome -->
  <link href="css/all.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body id="app" class="text-white text-center">


  <div class="container mt-4">

    <audio id="backgroundMusic" autoplay loop>
      <source src="assets/sounds/background-music2.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <!-- Responsive Canvas Wrapper -->
    <div class="d-flex justify-content-center">
      <div class="position-relative" style="width: 100%; max-width: 480px;">

        <!-- Start Screen -->
        <div id="startScreen">
          <h2><i class="fas fa-fish"></i> Flappy Fish </h2>
          <p>Help the fish swim through the pipes! Avoid hitting them or you'll lose!</p>
          <p class="mt-3">tap or press space to swim!</p>
          <img src="assets/img/fish3.gif" alt="Fish" class="intro-img">
          <button id="startBtn" class="btn btn-success">Start Game</button>
          <button id="installBtn" class="btn btn-primary mt-3 d-none">
            <i class="fas fa-download"></i> Install Game
          </button>
        </div>

        <div id="gameOverScreen" class="d-none">
          <h2 class="display-4 fw-bold">Fish <i class="fas fa-fish"></i> Over</h2>
          <p class="fs-4">Your Score: <span id="finalScore">0</span></p>
          <button class="btn btn-light mt-3" id="restartBtn">Restart </button>
        </div>


        <h2 id="scoreDisplay" class="my-3 fw-bold text-white">Score: 0</h2>
        <button id="muteBtn" class="btn btn-secondary ms-2"></button>
        <canvas id="gameCanvas" width="320" height="480" class="w-100"></canvas>

      </div>
    </div>

  </div>

  <!-- jQuery -->
  <script src="js/jquery-3.7.1.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="js/bootstrap.bundle.min.js"></script>

  <!-- Only include fish and game logic -->
  <script src="js/service-worker.js"></script>
  <script src="js/global.js"></script>
  <script src="js/fish.js"></script>
  <script src="js/game.js"></script>
  <script src="js/pipe.js"></script>
  <script src="js/collision.js"></script>
  <script src="js/score.js"></script>
  <script src="js/gameover.js"></script>
  <script src="js/start.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/background-music.js"></script>
  <script src="js/install.js"></script>



</body>

</html>
